<style>
:root{--bg:#f7f3ea;--cd:#fffdf8;--ink:#3e4a40;--dp:#20482a;--mu:#6f826f;--ln:#e3dccb;box-sizing:border-box}
*{box-sizing:inherit}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
h2,h3{font:italic 400 28px/1.2 Palatino,"Palatino Linotype",Georgia,serif;color:var(--dp);margin:0 0 10px}h3{font-size:22px}
#app,.w{max-width:640px;margin:0 auto;padding:0 22px}
section{padding:34px 0;border-top:1px solid var(--ln)}
.hero{text-align:center;padding:36px 0 28px}.hero img{width:min(300px,70%);mix-blend-mode:multiply}
.tg{color:var(--mu);margin:8px auto 0;max-width:32ch}
.mu{color:var(--mu);margin:0 0 14px}
.mk{display:flex;gap:16px;align-items:center;width:100%;text-align:left;background:var(--cd);border:1px solid var(--ln);border-radius:16px;padding:14px 16px;margin:0 0 12px;font:inherit;color:inherit;cursor:pointer}
.dt{display:flex;flex-direction:column;align-items:center;min-width:48px;font-size:13px;color:var(--mu)}
.dt b{font:italic 400 30px/1 Palatino,Georgia,serif;color:var(--dp)}
.in{flex:1;display:flex;flex-direction:column}.in small{color:var(--mu)}.go{color:var(--dp);font-size:15px}
input,textarea,select{width:100%;font:inherit;color:inherit;background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;margin:0 0 10px}
form{margin:0}
.bt{background:var(--dp);color:var(--bg);border:0;border-radius:999px;padding:13px 24px;font:inherit;cursor:pointer}.bt:disabled{opacity:.5}
.gh{background:none;color:var(--dp);border:1px solid var(--dp)}
.lk{background:none;border:0;color:var(--mu);text-decoration:underline;font:inherit;cursor:pointer;padding:6px 0}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--dp);outline-offset:2px}
footer{text-align:center;color:var(--mu);font-size:14px;padding:30px 0 60px;border-top:1px solid var(--ln)}
.ov{position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:5}
.ov .w{padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:120px}
.x{background:none;border:0;color:var(--mu);font:inherit;padding:8px 0;margin-bottom:10px;cursor:pointer}
.pr{display:flex;gap:14px;align-items:center;padding:16px 0;border-bottom:1px solid var(--ln)}
.pr img{width:84px;height:84px;object-fit:cover;border-radius:12px}
.pi{flex:1}.pi p{margin:2px 0;font-size:14px;color:var(--mu)}.pi small{color:var(--dp)}
.so{opacity:.55}.sd{font-size:14px;color:var(--mu)}
.q{display:flex;align-items:center;gap:10px}
.q button{width:36px;height:36px;border-radius:50%;border:1px solid var(--dp);background:none;color:var(--dp);font-size:18px;cursor:pointer}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--cd);border-top:1px solid var(--ln);padding:14px 22px calc(14px + env(safe-area-inset-bottom,0px))}
.rd{display:flex;gap:10px;align-items:center;margin:0 0 8px}.rd input{width:auto;margin:0}
.vp{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:12px 14px}
.cd{background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:14px;margin:0 0 12px}.cd small{color:var(--mu);display:block}
.tb{display:flex;gap:8px;margin:12px 0 16px;flex-wrap:wrap}
.tb button{border:1px solid var(--ln);background:none;color:var(--ink);border-radius:999px;padding:8px 16px;font:inherit;cursor:pointer}
.tb .on{background:var(--dp);color:var(--bg);border-color:var(--dp)}
.th{width:96px;height:96px;object-fit:cover;border-radius:12px;display:block;margin-bottom:8px}
.up{display:inline-block;border:1px dashed var(--mu);border-radius:10px;padding:6px 12px;margin:0 0 10px;color:var(--mu);cursor:pointer}
.sk{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}.sk input{width:90px;margin:0 0 6px}
#ts{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translate(-50%,-90px);background:var(--dp);color:var(--bg);padding:10px 18px;border-radius:999px;z-index:9;transition:transform .3s}
#ts.on{transform:translate(-50%,0)}
.lgw{text-align:right}.lgw select{width:auto;padding:6px 10px;margin:0 0 8px;font-size:14px}
[hidden]{display:none!important}
</style></head>

  const n2=tot();if(n2.c)b=`<div class="bar"><span>${n2.c} ${t('items')}, <b>${kr(n2.t)}</b></span><button class="bt" data-a="chk">${t('go')}</button></div>`}
 else if(step=='chk'){
  h+=`<h3>${t('yo')}</h3>${L2.map(p=>`<p>${cart[p.id]}× ${E(pn(p))} <span class="mu">${kr(p.price*cart[p.id])}</span></p>`).join('')}<p><b>${t('total')} ${kr(n.t)}</b></p><form id="of"><input name="n" placeholder="${t('fn')}" required><input name="s" placeholder="${t('ln')}" required><input name="c" type="tel" placeholder="${t('ph')}"><label class="rd"><input type="radio" name="y" value="ritiro" checked> ${t('pc')}</label><label class="rd"><input type="radio" name="y" value="vipps"> ${t('pv')}</label><p class="vp" hidden>${t('vp',{kr:kr(n.t),num:'<b>'+E(D.vipps||t('vpn'))+'</b>'})}</p><br><button class="bt" id="sb">${t('sb')}</button></form>`}
 else h+=`<h3>${t('tk',{n:E(who)})}</h3><p>${t('rc',{m:E(m.name),d:fd(m.date,{weekday:'long',day:'numeric',month:'long'})})}</p>${tel?`<p class="vp">${t('rem',{kr:kr(tel),num:'<b>'+E(D.vipps||t('vpn'))+'</b>'})}</p><br>`:''}<button class="bt" data-a="close">${t('bm')}</button>`;
 s.innerHTML=`<div class="w">${h}</div>${b}`}
function adm(){
 const a=$('#ad');a.hidden=false;document.body.style.overflow='hidden';
 if(!PW){a.innerHTML=`<div class="w"><button class="x" data-a="aclose">← Tilbake</button><h2>Admin</h2><form id="lf"><input type="password" name="p" placeholder="Passord" autocomplete="current-password" required><button class="bt">Logg inn</button></form></div>`;return}
 const T={mk:'Markeder',pr:'Produkter',od:'Bestillinger',if:'Info'};
 let h=`<button class="x" data-a="aclose">← Lukk</button><h2>Admin</h2><div class="tb">${Object.keys(T).map(k=>`<button class="${k==tab?'on':''}" data-a="tab" data-id="${k}">${T[k]}</button>`).join('')}</div>`;
 if(tab=='mk')h+=D.markets.map((m,i)=>`<div class="cd"><input data-p="markets.${i}.name" value="${E(m.name)}" placeholder="Navn på marked"><input type="date" data-p="markets.${i}.date" value="${E(m.date)}"><input data-p="markets.${i}.time" value="${E(m.time)}" placeholder="Tidspunkt (f.eks. 10:00–15:00)"><input data-p="markets.${i}.place" value="${E(m.place)}" placeholder="Sted"><button class="lk" data-a="delm" data-id="${i}">Slett</button></div>`).join('')+`<button class="bt gh" data-a="addm">+ Legg til marked</button>`;
 if(tab=='pr')h+=D.products.map((p,i)=>`<div class="cd">${p.img?`<img class="th" src="${E(p.img)}" alt="">`:''}<label class="up">${p.img?'Bytt bilde':'Legg til bilde'}<input type="file" accept="image/*" data-up="${i}" hidden></label><input data-p="products.${i}.name" value="${E(p.name)}" placeholder="Produktnavn"><textarea rows="2" data-p="products.${i}.desc" placeholder="Beskrivelse">${E(p.desc)}</textarea><input data-p="products.${i}.ne" value="${E(p.ne)}" placeholder="Produktnavn på engelsk (valgfritt)"><textarea rows="2" data-p="products.${i}.de" placeholder="Beskrivelse på engelsk (valgfritt)">${E(p.de)}</textarea><input type="number" step="any" data-p="products.${i}.price" value="${E(p.price)}" placeholder="Pris (kr)"><p class="mu">Antall tilgjengelig per marked. Tomt = ikke tilbudt, 0 = utsolgt.</p>${srt().map(m=>`<label class="sk">${E(mkl(m))}<input type="number" min="0" data-p="products.${i}.stock.${E(m.id)}" value="${p.stock&&m.id in p.stock?p.stock[m.id]:''}"></label>`).join('')}<button class="lk" data-a="delp" data-id="${i}">Slett produkt</button></div>`).join('')+`<button class="bt gh" data-a="addp">+ Legg til produkt</button>`;
 if(tab=='if')h+=`<textarea rows="7" data-p="about" placeholder="Om meg (norsk)">${E(D.about)}</textarea><textarea rows="7" data-p="aboutEn" placeholder="About me (English)">${E(D.aboutEn)}</textarea><input data-p="vipps" value="${E(D.vipps)}" placeholder="Vipps-nummer"><input data-p="ig" value="${E(D.ig)}" placeholder="Instagram (uten @)"><input data-p="email" value="${E(D.email)}" placeholder="E-post">`;
 if(tab=='od'){const ms=srt();omk=omk&&by(omk)?omk:(ms[0]||{}).id;const m=by(omk),os=m?ORD.filter(o=>o.mk==m.name&&o.date==m.date):[];
  h+=ms.length?`<select id="osel">${ms.map(x=>`<option value="${E(x.id)}"${x.id==omk?' selected':''}>${E(mkl(x))}</option>`).join('')}</select><p class="mu">${os.length} bestillinger, ${kr(os.reduce((a,o)=>a+o.tot,0))} totalt, ${kr(os.filter(o=>o.paid).reduce((a,o)=>a+o.tot,0))} betalt</p>`+(os.map(o=>`<div class="cd"><b>${E(o.name)} ${E(o.surname)}</b><small>${E(o.txt)}</small><small>${kr(o.tot)}, ${E(o.pay)}${o.tel?', '+E(o.tel):''}</small><label class="sk">Betalt <input type="checkbox" style="width:auto" data-pd="${E(o.id)}"${o.paid?' checked':''}></label><button class="lk" data-a="delo" data-id="${E(o.id)}">Slett</button></div>`).join('')||'<p class="mu">Ingen bestillinger ennå.</p>')+`<button class="bt gh" data-a="ord">Oppdater</button>`:'<p class="mu">Legg til et marked først.</p>'}
 a.innerHTML=`<div class="w">${h}</div>${tab=='od'?'':`<div class="bar"><span class="mu">Endringer vises for kundene når du lagrer.</span><button class="bt" data-a="save">Lagre</button></div>`}`}
async function orders(){try{const r=await post({a:'orders',pw:PW});if(r.orders){ORD=r.orders;adm()}}catch(_){toast('Kunne ikke hente bestillinger')}}
async function save(){try{const r=await post({a:'save',pw:PW,data:D});if(r.ok){setData(D);toast('Lagret')}else toast('Feil: '+r.error)}catch(_){toast('Kunne ikke lagre. Prøv igjen.')}}
function setp(p,v){const k=p.split('.');let o=D;for(let i=0;i<k.length-1;i++)o=o[k[i]];const l=k[k.length-1];if(v===''&&k.indexOf('stock')>0)delete o[l];else o[l]=v}
const shrink=f=>new Promise(r=>{const i=new Image();i.onload=()=>{const s=Math.min(1,800/i.width),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.8).split(',')[1])};i.src=URL.createObjectURL(f)});
const uid=p=>p+Date.now().toString(36);
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id,P=D.products.find(x=>x.id==id);
 if(a=='open'){cur=id;cart={};step='cat';sheet()}
 else if(a=='close'){$('#sh').hidden=true;document.body.style.overflow=''}
 else if(a=='p'){if((cart[id]||0)<rem(P))cart[id]=(cart[id]||0)+1;sheet()}
 else if(a=='m'){cart[id]=Math.max(0,(cart[id]||0)-1);sheet()}
 else if(a=='chk'){step='chk';sheet()}else if(a=='back'){step='cat';sheet()}
 else if(a=='adm')adm();else if(a=='aclose'){$('#ad').hidden=true;document.body.style.overflow='';render()}
 else if(a=='tab'){tab=id;if(id=='od')orders();else adm()}
 else if(a=='ord')orders();
 else if(a=='addm'){D.markets.push({id:uid('m'),name:'',date:td(),time:'',place:''});adm()}
 else if(a=='delm'){D.markets.splice(+id,1);adm()}
 else if(a=='addp'){D.products.push({id:uid('p'),name:'',desc:'',ne:'',de:'',price:0,img:'',stock:{}});adm()}
 else if(a=='delp'){D.products.splice(+id,1);adm()}
 else if(a=='delo')post({a:'del',pw:PW,id}).then(()=>{orders();refresh()});
 else if(a=='save')save()});
document.addEventListener('input',e=>{const p=e.target.dataset.p;if(p)setp(p,e.target.type=='number'&&e.target.value!==''?+e.target.value:e.target.value)});
document.addEventListener('change',async e=>{const g=e.target;
 if(g.id=='lg'){L=g.value;try{localStorage.setItem('lg',L)}catch(_){}render();if(!$('#sh').hidden)sheet()}
 else if(g.name=='y'&&$('.vp'))$('.vp').hidden=g.value!='vipps';
 else if(g.id=='osel'){omk=g.value;adm()}
 else if(g.dataset.pd)post({a:'paid',pw:PW,id:g.dataset.pd,paid:g.checked}).then(()=>orders());
 else if(g.dataset.up!=null&&g.files[0]){try{toast('Laster opp bilde…');const r=await post({a:'upload',pw:PW,b64:await shrink(g.files[0])});if(!r.url)throw 0;D.products[+g.dataset.up].img=r.url;adm()}catch(x){toast('Kunne ikke laste opp bildet')}}});
document.addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target),id=e.target.id,btn=e.target.querySelector('button.bt');
 if(busy)return;busy=true;if(btn)btn.disabled=true;
 try{
  if(!API)throw new Error('API');
  if(id=='lf'){const r=await post({a:'login',pw:f.get('p')});if(r.ok){PW=f.get('p');tab='mk';adm()}else toast('Feil passord')}
  else if(id=='cf'){const r=await post({a:'catering',n:f.get('n'),c:f.get('c'),d:f.get('d'),p:f.get('p'),t:f.get('t')});if(r.ok){e.target.reset();toast(t('thx'))}else throw 0}
  else if(id=='of'){const items=off().filter(p=>cart[p.id]).map(p=>({id:p.id,q:cart[p.id]})),pay=f.get('y');
   const r=await post({a:'order',mk:cur,items,name:f.get('n'),surname:f.get('s'),tel:f.get('c'),pay});
   if(r.error=='soldout'){setData(r.data);cart={};step='cat';sheet();toast(t('sold',{b:r.bad.join(', ')}))}
   else if(r.ok){setData(r.data);who=f.get('n');tel=pay=='vipps'?r.tot:0;step='done';cart={};sheet();render()}else throw 0}
 }catch(x){toast(x&&x.message=='API'?t('noapi'):t('err'))}
 busy=false;if(btn)btn.disabled=false});
render();refresh();
</script></body></html>
