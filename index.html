<style>
/* Er Mel brand: farina/carta grounds, inchiostro text, basilico = actions, pomodoro = the one CTA, kraft = material, spiga = logo gold */
:root{--bg:#f5efe4;--cd:#fffbf3;--ink:#1e1b17;--mu:#5d554a;--dp:#2e6a3a;--on-dp:#fff;--cta:#b8322a;--on-cta:#fff;--crosta:#7f4f22;--kraft:#d6b98f;--on-kraft:#1e1b17;--spiga:#ddaa30;--ln:#d8ccb8;
--fd:"Antonio","Oswald","Arial Narrow",sans-serif;--fb:"Instrument Sans","Helvetica Neue",Arial,sans-serif;--fm:"DM Mono",ui-monospace,monospace;box-sizing:border-box;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#191713;--cd:#24211c;--ink:#f2ebdf;--mu:#b6ab9b;--dp:#7cba7f;--on-dp:#14110d;--cta:#f0715f;--on-cta:#14110d;--crosta:#d39a62;--ln:#3b362e;color-scheme:dark}}
*{box-sizing:inherit}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--fb);padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
h2,h3{font:300 34px/1.05 var(--fd);text-transform:uppercase;letter-spacing:.01em;color:var(--ink);margin:0 0 10px;text-wrap:balance}h3{font-size:26px;font-weight:400}
.ey{font:500 11px/1.3 var(--fm);letter-spacing:.14em;text-transform:uppercase;color:var(--mu);margin:0 0 8px;display:block}
#app,.w{max-width:640px;margin:0 auto;padding:0 max(22px,env(safe-area-inset-left,0px)) 0 max(22px,env(safe-area-inset-right,0px))}
section{padding:40px 0;border-top:1px solid var(--ln)}
.hero{text-align:center;padding:28px 0 32px}.hero img{width:min(280px,72%);height:auto}
.hero .lgd{display:none}
@media (prefers-color-scheme:dark){.hero .lgl{display:none}.hero .lgd{display:inline}}
.tg{color:var(--mu);margin:6px auto 0;max-width:34ch;font-size:17px}
.hero .ey{margin-top:14px}
.mu{color:var(--mu);margin:0 0 16px}
.mkm{margin:4px 0 0}.mkm summary{cursor:pointer;list-style:none;display:inline-block;padding:10px 14px;margin:0 0 10px;border:1px solid var(--ln);border-radius:3px;font-family:var(--fm);font-size:13px;letter-spacing:.04em;text-transform:uppercase}.mkm summary::-webkit-details-marker{display:none}.mkm summary::after{content:' ▾'}.mkm[open] summary::after{content:' ▴'}
.mk{display:flex;gap:16px;align-items:center;width:100%;text-align:left;background:var(--cd);border:1px solid var(--ln);border-radius:3px;padding:12px 14px;margin:0 0 10px;font:inherit;color:inherit;cursor:pointer;transition:border-color .15s}
.mk:hover{border-color:var(--mu)}
.dt{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:56px;padding:6px 4px;background:var(--kraft);color:var(--on-kraft);border-radius:3px;font:500 11px/1.2 var(--fm);letter-spacing:.1em;text-transform:uppercase}
.dt b{font:400 30px/1 var(--fd);letter-spacing:0}
.in{flex:1;display:flex;flex-direction:column;min-width:0}.in strong{font:500 20px/1.15 var(--fd);text-transform:uppercase;letter-spacing:.02em}.in small{color:var(--mu)}
.go{background:var(--cta);color:var(--on-cta);font:500 12px/1 var(--fm);letter-spacing:.08em;text-transform:uppercase;padding:8px 12px;border-radius:999px;white-space:nowrap}
input,textarea,select{width:100%;font:inherit;color:inherit;background:var(--cd);border:1px solid var(--ln);border-radius:3px;padding:12px 14px;margin:0 0 10px}
input:focus,textarea:focus,select:focus{border-color:var(--mu)}
form{margin:0}
.bt{background:var(--dp);color:var(--on-dp);border:0;border-radius:999px;padding:13px 24px;font:600 15px/1.2 var(--fb);letter-spacing:.02em;cursor:pointer}.bt:disabled{opacity:.5}
.gh{background:none;color:var(--dp);border:1px solid var(--dp)}
.lk{background:none;border:0;color:var(--mu);text-decoration:underline;font:inherit;cursor:pointer;padding:6px 0}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
footer{text-align:center;color:var(--on-kraft);background:var(--kraft);font:400 13px/1.7 var(--fm);letter-spacing:.04em;padding:30px max(22px,env(safe-area-inset-left,0px)) 60px;margin:0 calc(-1 * max(22px,env(safe-area-inset-left,0px)))}
footer .lk{color:var(--on-kraft)}
.ov{position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:5}
.ov .w{padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:120px}
.x{background:none;border:0;color:var(--mu);font:500 12px/1 var(--fm);letter-spacing:.1em;text-transform:uppercase;padding:10px 0;margin-bottom:10px;cursor:pointer}
.pr{display:flex;gap:14px;align-items:center;padding:16px 0;border-bottom:1px solid var(--ln)}
.pr img{width:84px;height:84px;object-fit:cover;border-radius:0}
.pi{flex:1;min-width:0}.pi strong{font:500 20px/1.15 var(--fd);text-transform:uppercase;letter-spacing:.02em}.pi p{margin:2px 0;font-size:14px;color:var(--mu)}.pi small{color:var(--crosta);font:500 13px/1.3 var(--fm)}
.so{opacity:.55}.sd{font:500 11px/1 var(--fm);letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}
.q{display:flex;align-items:center;gap:10px}.q b{font:500 16px var(--fm);min-width:1.2em;text-align:center}
.q button{width:36px;height:36px;border-radius:50%;border:1px solid var(--dp);background:none;color:var(--dp);font-size:18px;cursor:pointer}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--cd);border-top:1px solid var(--ln);padding:14px max(22px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(22px,env(safe-area-inset-left,0px))}
.bar b{font-family:var(--fm)}
.rd{display:flex;gap:10px;align-items:center;margin:0 0 8px}.rd input{width:auto;margin:0}
.vp{background:var(--cd);border:1px solid var(--ln);border-radius:3px;padding:12px 14px}
.jt{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin:10px 0 0}.jt strong{font:500 20px/1.15 var(--fd);text-transform:uppercase;letter-spacing:.02em}.jt b{font:500 15px/1 var(--fm);color:var(--crosta);white-space:nowrap}.jd{margin:2px 0 0;font-size:14px;color:var(--mu)}.jr{font-size:14px;margin:0 0 16px;padding-left:18px}
.cd{background:var(--cd);border:1px solid var(--ln);border-radius:3px;padding:14px;margin:0 0 12px}.cd small{color:var(--mu);display:block}
.tb{display:flex;gap:8px;margin:12px 0 16px;flex-wrap:wrap}
.tb button{border:1px solid var(--ln);background:none;color:var(--ink);border-radius:999px;padding:8px 16px;font:inherit;cursor:pointer}
.tb .on{background:var(--dp);color:var(--on-dp);border-color:var(--dp)}
.th{width:96px;height:96px;object-fit:cover;border-radius:0;display:block;margin-bottom:8px}
.up{display:inline-block;border:1px dashed var(--mu);border-radius:3px;padding:6px 12px;margin:0 0 10px;color:var(--mu);cursor:pointer}
.sk{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}.sk input{width:90px;margin:0 0 6px}
#ts{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translate(-50%,-90px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;z-index:9;transition:transform .3s}
#ts.on{transform:translate(-50%,0)}
.lgw{text-align:right}.lgw select{width:auto;padding:6px 10px;margin:0 0 8px;font:500 12px/1 var(--fm);letter-spacing:.06em}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}#ts,.mk{transition:none}}
[hidden]{display:none!important}
</style></head>

 let h=`<button class="x" data-a="aclose">← Lukk</button><h2>Admin</h2><div class="tb">${Object.keys(T).map(k=>`<button class="${k==tab?'on':''}" data-a="tab" data-id="${k}">${T[k]}</button>`).join('')}</div>`;
 if(tab=='mk')h+=D.markets.map((m,i)=>`<div class="cd"><input data-p="markets.${i}.name" value="${E(m.name)}" placeholder="Navn på marked"><input type="date" data-p="markets.${i}.date" value="${E(m.date)}"><input data-p="markets.${i}.time" value="${E(m.time)}" placeholder="Tidspunkt (f.eks. 10:00–15:00)"><input data-p="markets.${i}.place" value="${E(m.place)}" placeholder="Sted"><button class="lk" data-a="delm" data-id="${i}">Slett</button></div>`).join('')+`<button class="bt gh" data-a="addm">+ Legg til marked</button>`;
 if(tab=='pr')h+=D.products.map((p,i)=>`<div class="cd">${p.img?`<img class="th" src="${E(p.img)}" alt="">`:''}<label class="up">${p.img?'Bytt bilde':'Legg til bilde'}<input type="file" accept="image/*" data-up="${i}" hidden></label><input data-p="products.${i}.name" value="${E(p.name)}" placeholder="Produktnavn"><textarea rows="2" data-p="products.${i}.desc" placeholder="Beskrivelse">${E(p.desc)}</textarea><input data-p="products.${i}.ne" value="${E(p.ne)}" placeholder="Produktnavn på engelsk (valgfritt)"><textarea rows="2" data-p="products.${i}.de" placeholder="Beskrivelse på engelsk (valgfritt)">${E(p.de)}</textarea><input type="number" step="any" data-p="products.${i}.price" value="${E(p.price)}" placeholder="Pris (kr)"><p class="mu">Antall tilgjengelig per marked. Tomt = ikke tilbudt, 0 = utsolgt.</p>${srt().map(m=>`<label class="sk">${E(mkl(m))}<input type="number" min="0" data-p="products.${i}.stock.${E(m.id)}" value="${p.stock&&m.id in p.stock?p.stock[m.id]:''}"></label>`).join('')}<button class="lk" data-a="delp" data-id="${i}">Slett produkt</button></div>`).join('')+`<button class="bt gh" data-a="addp">+ Legg til produkt</button>`;
 if(tab=='if')h+=`<textarea rows="7" data-p="about" placeholder="Om meg (norsk)">${E(D.about)}</textarea><textarea rows="7" data-p="aboutEn" placeholder="About me (English)">${E(D.aboutEn)}</textarea><input data-p="vipps" value="${E(D.vipps)}" placeholder="Vipps-nummer"><input data-p="ig" value="${E(D.ig)}" placeholder="Instagram (uten @)"><input data-p="email" value="${E(D.email)}" placeholder="E-post">`;
 if(tab=='od'){const ms=srt();omk=omk&&by(omk)?omk:(ms[0]||{}).id;const m=by(omk),os=m?ORD.filter(o=>o.mk==m.name&&o.date==m.date):[];
  h+=ms.length?`<select id="osel">${ms.map(x=>`<option value="${E(x.id)}"${x.id==omk?' selected':''}>${E(mkl(x))}</option>`).join('')}</select><p class="mu">${os.length} bestillinger, ${kr(os.reduce((a,o)=>a+o.tot,0))} totalt, ${kr(os.filter(o=>o.paid).reduce((a,o)=>a+o.tot,0))} betalt</p>`+(os.map(o=>`<div class="cd"><b>${E(o.name)} ${E(o.surname)}</b><small>${E(o.txt)}</small><small>${kr(o.tot)}, ${E(o.pay)}${o.tel?', '+E(o.tel):''}</small><label class="sk">Betalt <input type="checkbox" style="width:auto" data-pd="${E(o.id)}"${o.paid?' checked':''}></label><button class="lk" data-a="delo" data-id="${E(o.id)}">Slett</button></div>`).join('')||'<p class="mu">Ingen bestillinger ennå.</p>')+(m&&os.length?remBox(m,os):'')+`<div class="tb"><button class="bt gh" data-a="ord">Oppdater</button><button class="bt" data-a="exg">Kopier til gestionale</button></div><textarea id="exo" rows="4" readonly hidden></textarea>`:'<p class="mu">Legg til et marked først.</p>'}
 a.innerHTML=`<div class="w">${h}</div>${tab=='od'?'':`<div class="bar"><span class="mu">Endringer vises for kundene når du lagrer.</span><button class="bt" data-a="save">Lagre</button></div>`}`}
const conOf=o=>{const s=String(o.tel||''),em=o.email||(s.match(/[^\s·]+@[^\s·]+/)||[''])[0],ph=(o.phone||s.replace(/[^\s·]+@[^\s·]+/g,'').replace(/·/g,'')).trim();return{em,ph}};
const waNum=ph=>{let d=ph.replace(/[^\d+]/g,'');if(d.startsWith('+'))return d.slice(1);if(d.startsWith('00'))return d.slice(2);return d.length==8?'47'+d:d};
const remTxt=(o,m)=>`Hei ${o.name}! Påminnelse fra Er Mel microbakery: bestillingen din (${o.txt}) er klar for henting ${fd(m.date,{weekday:'long',day:'numeric',month:'long'})}${m.time?', '+m.time:''}${m.place?', '+m.place:''}.${o.paid?'':` Totalt ${kr(o.tot)}${o.pay=='vipps'&&D.vipps?', husk Vipps til '+D.vipps:', betales ved henting'}.`} Vi sees! Nicolò`;
function remBox(m,os){return `<div class="cd"><b>Påminnelser</b><small>Send påminnelsen dagen før markedet.</small>${os.map(o=>{const c=conOf(o),x=encodeURIComponent(remTxt(o,m)),sub=encodeURIComponent('Påminnelse: henting hos Er Mel');
 return `<div class="sk" style="border-top:1px solid var(--ln);padding-top:8px;margin-top:8px"><span>${E(o.name)} ${E(o.surname)}<small>${E([c.ph,c.em].filter(Boolean).join(' · ')||'ingen kontakt')}</small></span><span>${c.ph?`<a href="https://wa.me/${waNum(c.ph)}?text=${x}" target="_blank" rel="noopener">WhatsApp</a> · <a href="sms:${E(c.ph.replace(/\s/g,''))}?&body=${x}">SMS</a>`:''}${c.ph&&c.em?' · ':''}${c.em?`<a href="mailto:${E(c.em)}?subject=${sub}&body=${x}">E-post</a>`:''}</span></div>`}).join('')}</div>`}
function exportG(){const m=by(omk);if(!m)return;const os=ORD.filter(o=>o.mk==m.name&&o.date==m.date);
 const j=JSON.stringify({src:'ermel-site',market:{id:m.id,name:m.name,date:m.date,time:m.time,place:m.place},products:D.products.map(p=>({id:p.id,name:p.name,price:p.price})),
  orders:os.map(o=>{const c=conOf(o);return{id:o.id,name:o.name,surname:o.surname,phone:c.ph,email:c.em,pay:o.pay,paid:!!o.paid,tot:o.tot,txt:o.txt,items:o.items||null}})});
 const show=()=>{const a=$('#exo');a.hidden=false;a.value=j;a.select();toast('Marker teksten og kopier den')};
 try{navigator.clipboard.writeText(j).then(()=>toast(`Kopiert: ${os.length} bestillinger. Lim inn i gestionalen.`),show)}catch(_){show()}}
async function orders(){try{const r=await post({a:'orders',pw:PW});if(r.orders){ORD=r.orders;adm()}}catch(_){toast('Kunne ikke hente bestillinger')}}
async function save(){try{const r=await post({a:'save',pw:PW,data:D});if(r.ok){setData(D);toast('Lagret')}else toast('Feil: '+r.error)}catch(_){toast('Kunne ikke lagre. Prøv igjen.')}}
function setp(p,v){const k=p.split('.');let o=D;for(let i=0;i<k.length-1;i++)o=o[k[i]];const l=k[k.length-1];if(v===''&&k.indexOf('stock')>0)delete o[l];else o[l]=v}
const shrink=f=>new Promise(r=>{const i=new Image();i.onload=()=>{const s=Math.min(1,800/i.width),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.8).split(',')[1])};i.src=URL.createObjectURL(f)});
const uid=p=>p+Date.now().toString(36);
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id,P=D.products.find(x=>x.id==id);
 if(a=='open'){cur=id;cart={};step='cat';sheet()}
 else if(a=='close'){$('#sh').hidden=true;document.body.style.overflow=''}
 else if(a=='p'){if((cart[id]||0)<rem(P))cart[id]=(cart[id]||0)+1;sheet()}
 else if(a=='m'){cart[id]=Math.max(0,(cart[id]||0)-1);sheet()}
 else if(a=='chk'){step='chk';sheet()}else if(a=='back'){step='cat';sheet()}
 else if(a=='adm')adm();else if(a=='aclose'){$('#ad').hidden=true;document.body.style.overflow='';render()}
 else if(a=='tab'){tab=id;if(id=='od')orders();else adm()}
 else if(a=='ord')orders();else if(a=='exg')exportG();
 else if(a=='addm'){D.markets.push({id:uid('m'),name:'',date:td(),time:'',place:''});adm()}
 else if(a=='delm'){D.markets.splice(+id,1);adm()}
 else if(a=='addp'){D.products.push({id:uid('p'),name:'',desc:'',ne:'',de:'',price:0,img:'',stock:{}});adm()}
 else if(a=='delp'){D.products.splice(+id,1);adm()}
 else if(a=='delo')post({a:'del',pw:PW,id}).then(()=>{orders();refresh()});
 else if(a=='save')save()});
document.addEventListener('input',e=>{const p=e.target.dataset.p;if(p)setp(p,e.target.type=='number'&&e.target.value!==''?+e.target.value:e.target.value)});
document.addEventListener('change',async e=>{const g=e.target;
 if(g.id=='lg'){L=g.value;try{localStorage.setItem('lg',L)}catch(_){}render();if(!$('#sh').hidden)sheet()}
 else if(g.name=='y'&&$('.vp'))$('.vp').hidden=g.value!='vipps';
 else if(g.id=='osel'){omk=g.value;adm()}
 else if(g.dataset.pd)post({a:'paid',pw:PW,id:g.dataset.pd,paid:g.checked}).then(()=>orders());
 else if(g.dataset.up!=null&&g.files[0]){try{toast('Laster opp bilde…');const r=await post({a:'upload',pw:PW,b64:await shrink(g.files[0])});if(!r.url)throw 0;D.products[+g.dataset.up].img=r.url;adm()}catch(x){toast('Kunne ikke laste opp bildet')}}});
document.addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target),id=e.target.id,btn=e.target.querySelector('button.bt');
 if(busy)return;busy=true;if(btn)btn.disabled=true;
 try{
  if(!API)throw new Error('API');
  if(id=='lf'){const r=await post({a:'login',pw:f.get('p')});if(r.ok){PW=f.get('p');tab='mk';adm()}else toast('Feil passord')}
  else if(id=='cf'){const r=await post({a:'catering',n:f.get('n'),c:f.get('c'),d:f.get('d'),p:f.get('p'),t:(f.get('k')?'['+f.get('k')+'] ':'')+f.get('t')});if(r.ok){e.target.reset();toast(t('thx'))}else throw 0}
  else if(id=='of'){const items=off().filter(p=>cart[p.id]).map(p=>({id:p.id,q:cart[p.id]})),pay=f.get('y');
   const ph=String(f.get('c')||'').trim(),em=String(f.get('e')||'').trim();
   if(!ph&&!em)throw new Error('CON');if(ph&&ph.replace(/\D/g,'').length<8)throw new Error('PH');
   const r=await post({a:'order',mk:cur,items,name:f.get('n'),surname:f.get('s'),tel:[ph,em].filter(Boolean).join(' · '),phone:ph,email:em,pay});
   if(r.error=='soldout'){setData(r.data);cart={};step='cat';sheet();toast(t('sold',{b:r.bad.join(', ')}))}
   else if(r.ok){setData(r.data);who=f.get('n');tel=pay=='vipps'?r.tot:0;step='done';cart={};sheet();render()}else throw 0}
 }catch(x){toast(x&&x.message=='API'?t('noapi'):x&&x.message=='CON'?t('nocon'):x&&x.message=='PH'?t('badph'):t('err'))}
 busy=false;if(btn)btn.disabled=false});
render();refresh();
</script></body></html>
